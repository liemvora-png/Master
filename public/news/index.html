<script>
(function () {
  const list = document.querySelector("#news-list");
  const updated = document.querySelector("#news-updated");

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (character) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;",
      "'": "&#39;"
    })[character]);
  }

  function formatDate(value) {
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return new Intl.DateTimeFormat(undefined, {
      month: "short",
      day: "numeric",
      year: "numeric"
    }).format(date);
  }

  function renderNews(items) {
    if (!items.length) {
      list.insertAdjacentHTML("afterbegin", '<p class="empty-state">No tech news available right now.</p>');
      return;
    }

    const groups = new Map();
    for (const item of items) {
      const date = item.published_at ? new Date(item.published_at) : new Date();
      const key = date.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(item);
    }

    let html = "";
    for (const [dateKey, dayItems] of groups) {
      html += `<h2>${escapeHtml(dateKey)}</h2>`;
      for (const item of dayItems) {
        const timeStr = item.published_at ? formatDate(item.published_at) : "";
        const body = item.body ? `<p>${escapeHtml(item.body)}</p>` : "";
        const sourceName = escapeHtml(item.source_name || "Source");
        const sourceUrl = item.source_url ? escapeHtml(item.source_url) : null;
        const sourceHtml = sourceUrl
          ? `<p class="source"><a href="${sourceUrl}">${sourceName} ↗</a></p>`
          : `<p class="source">${sourceName}</p>`;
        html += `
<article>
  <time datetime="${escapeHtml(item.published_at || "")}">${timeStr}</time>
  <h3>${escapeHtml(item.headline || "Untitled")}</h3>
  ${body}
  ${sourceHtml}
</article>`;
      }
    }
    list.innerHTML = html;
  }

  function renderStaticFallback() {
    const template = document.querySelector("#news-static");
    if (!template) return;
    list.innerHTML = template.innerHTML;
    const time = template.querySelector("time[datetime]");
    if (time && updated) {
      updated.dateTime = time.getAttribute("datetime");
      updated.textContent = time.textContent;
    }
  }

  async function loadNews() {
    try {
      const response = await fetch("/api/news", { headers: { Accept: "application/json" } });
      if (!response.ok) throw new Error(`News request returned ${response.status}.`);
      const { news } = await response.json();
      const items = Array.isArray(news) ? news : [];
      if (items.length) {
        const newest = items[0].published_at || "";
        if (newest && updated) {
          updated.dateTime = newest;
          updated.textContent = formatDate(newest);
        }
        renderNews(items);
        return;
      }
      throw new Error("No news items available.");
    } catch (error) {
      console.error("Unable to load the news digest:", error);
      renderStaticFallback();
    }
  }

  loadNews();
})();
</script>
