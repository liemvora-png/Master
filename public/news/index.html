<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f1e9">
<title>Tech News Digest</title>
<script>
  (function () {
    var theme = null;
    try { theme = localStorage.getItem("theme"); } catch (e) {}
    if (theme === "dark" || theme === "light") {
      document.documentElement.setAttribute("data-theme", theme);
    }
  })();

</script>
<meta name="description" content="Latest tech news digest: markets, memory prices, hardware releases, and research.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script src="/assets/site.js" defer></script>
<style>
  .news-digest {
    max-width: 46rem;
    margin: 2.5rem auto 0;
    padding: 0 1.25rem 3rem;
    color: var(--ink);
  }
  .news-digest h1 {
    margin: 0 0 .3rem;
    font-size: clamp(2rem, 5vw, 2.8rem);
    line-height: 1.05;
    letter-spacing: .01em;
  }
  .news-digest .updated {
    margin: 0 0 1rem;
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.85rem;
    letter-spacing: .12em;
  }
  .news-digest h2 {
    margin: 2.5rem 0 .5rem;
    padding-bottom: .4rem;
    border-bottom: 1px solid var(--line);
    font-size: 1.35rem;
    letter-spacing: .08em;
  }
  .news-digest article {
    padding: 1.15rem 0;
    border-bottom: 1px solid var(--line);
  }
  .news-digest time {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 0.85rem;
    letter-spacing: .12em;
    font-variant-numeric: tabular-nums;
  }
  .news-digest h3 {
    margin: .35rem 0 .45rem;
    font-family: var(--serif);
    font-size: clamp(1.15rem, 2.4vw, 1.4rem);
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: .02em;
  }
  .news-digest p { margin: .35rem 0; line-height: 1.65; }
  .news-digest .source { margin-top: .7rem; font-size: .85rem; }
  .news-digest .source a {
    display: inline-flex;
    min-height: 44px;
    align-items: center;
    gap: .4rem;
    padding: .45rem .8rem;
    border: 1px solid var(--line);
    border-radius: 2px;
    color: var(--olive);
    font-size: .78rem;
  }
  .news-digest .source a:hover {
    border-color: var(--olive);
    background: var(--paper-deep);
  }
  .news-digest .source a:focus-visible {
    outline: 2px solid var(--olive);
    outline-offset: 3px;
  }
  .news-digest .source a::after {
    content: "\2197";
    font-size: .85em;
  }
  .news-status {
    min-height: 7rem;
    margin: 1.5rem 0;
    border: 1px solid var(--line);
    padding: 1.25rem;
  }
  .news-status p {
    color: var(--muted);
  }
  .news-status button {
    min-height: 44px;
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: .7rem .9rem;
    background: var(--surface);
    color: var(--ink);
  }
  .news-status button:hover {
    border-color: var(--olive);
    background: var(--paper-deep);
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header">
  <a class="wordmark" href="/" aria-label="Liem Vora home"><span class="wordmark-symbol" aria-hidden="true">δ</span><span class="wordmark-name">Liem Vora</span></a>
  <nav class="site-nav" id="site-navigation" aria-label="Main navigation" aria-hidden="true" inert>
    <a href="/">Home</a>
    <a href="/projects">Projects</a>
    <a href="/accomplishments.html">Accomplishments</a>
    <a href="/arrangements.html">Arrangements</a>
    <a href="/services">Services</a>
    <a href="/gallery">Gallery</a>
    <a href="/news" aria-current="page">News</a>
  </nav>
  <div class="header-actions">
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-controls="site-navigation" aria-expanded="false"><span class="menu-toggle-lines" aria-hidden="true"><span class="menu-toggle-line"></span><span class="menu-toggle-line"></span><span class="menu-toggle-line"></span></span></button>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme"><span class="theme-toggle-icon" aria-hidden="true">☾</span></button>
    <a class="admin-entry-button" href="/admin">Admin <span aria-hidden="true">↗</span></a>
  </div>
</header>

<main class="news-digest" id="main">
<h1>Tech News Digest</h1>
<p class="updated">Last updated <time id="news-updated" datetime="">Loading...</time></p>

<section id="news-list" aria-busy="true">
  <div class="news-status" role="status">
    <p>Loading tech news...</p>
  </div>
</section>
</main>

<footer class="site-footer">
  <span>δ</span>
  <span>MADE WITH CARE <span class="footer-dot" aria-hidden="true">·</span> 2026</span>
</footer>

<script>
(function () {
  const list = document.querySelector("#news-list");
  const updated = document.querySelector("#news-updated");

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, (character) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      "\"": "&quot;",
      "'": "&#39;"
    })[character]);
  }

  function formatDate(value) {
    if (!value) return "";
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return value;
    return new Intl.DateTimeFormat(undefined, {
      month: "short",
      day: "numeric",
      year: "numeric"
    }).format(date);
  }

  function renderStatus(title, action) {
    list.setAttribute("aria-busy", "false");
    list.innerHTML = `
      <div class="news-status" role="${action ? "alert" : "status"}">
        <p>${escapeHtml(title)}</p>
        ${action ? '<button type="button" data-news-retry>Try again</button>' : ""}
      </div>`;
    if (action) {
      list.querySelector("[data-news-retry]").addEventListener("click", loadNews);
    }
  }

  function renderNews(items) {
    list.setAttribute("aria-busy", "false");
    if (!items.length) {
      renderStatus("No tech news is available right now.");
      return;
    }

    const groups = new Map();
    for (const item of items) {
      const date = item.published_at ? new Date(item.published_at) : new Date();
      const key = date.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(item);
    }

    let html = "";
    for (const [dateKey, dayItems] of groups) {
      html += `<h2>${escapeHtml(dateKey)}</h2>`;
      for (const item of dayItems) {
        const timeStr = item.published_at ? formatDate(item.published_at) : "";
        const body = item.body ? `<p>${escapeHtml(item.body)}</p>` : "";
        const sourceName = escapeHtml(item.source_name || "Source");
        const sourceUrl = item.source_url ? escapeHtml(item.source_url) : null;
        const sourceHtml = sourceUrl
          ? `<p class="source"><a href="${sourceUrl}">${sourceName} ↗</a></p>`
          : `<p class="source">${sourceName}</p>`;
        html += `
<article>
  <time datetime="${escapeHtml(item.published_at || "")}">${timeStr}</time>
  <h3>${escapeHtml(item.headline || "Untitled")}</h3>
  ${body}
  ${sourceHtml}
</article>`;
      }
    }
    list.innerHTML = html;
  }

  async function loadNews() {
    list.setAttribute("aria-busy", "true");
    try {
        const response = await fetch("/api/news?limit=1", { headers: { Accept: "application/json" } });
      if (!response.ok) throw new Error(`News request returned ${response.status}.`);
        const data = await response.json();
        const items = Array.isArray(data.news) ? data.news : [];
      if (items.length) {
        const newest = items[0].published_at || "";
        if (newest && updated) {
          updated.dateTime = newest;
          updated.textContent = formatDate(newest);
        }
        renderNews(items);
        return;
      }
      if (updated) updated.textContent = "Unavailable";
      renderStatus("No tech news is available right now.");
    } catch (error) {
      console.error("Unable to load the news digest:", error);
      if (updated) updated.textContent = "Unavailable";
      renderStatus("Tech news could not be loaded.", true);
    }
  }

  loadNews();
})();
</script>
</body>
</html>
